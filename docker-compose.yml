services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend_mastery
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: change_me_local_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U backend_user -d backend_mastery"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
